<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../frame/fonts/fonts.css">
</helmet>
<div style="background:var(--cz-paper);border:var(--cz-border);border-radius:var(--cz-radius-box);padding:var(--cz-pad-panel);display:flex;flex-direction:column;gap:16px">

<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--cz-night);border-radius:var(--cz-radius-item);padding:14px 18px">
<span style="font:500 16px/1.3 var(--cz-mono);color:var(--cz-night-soft)">Overall satisfaction now</span>
<span style="font:700 22px/1.1 var(--cz-display);color:var(--cz-paper)">3.2/5</span>
<span style="font:400 16px/1.4 var(--cz-sans);color:var(--cz-night-thought)">Three root causes, and a solution for each one</span>
</div>

<sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
<div style="display:flex;flex-wrap:wrap;gap:12px;align-items:stretch">
<div style="flex:1 1 260px;min-width:0;background:var(--cz-desk);border:var(--cz-border);border-radius:var(--cz-radius-item);padding:16px;display:flex;flex-direction:column;gap:10px">
<span style="font:var(--cz-mono-tag);color:var(--cz-problem-ink)">Cause · {{ r.cells }}</span>
<span style="font:var(--cz-display-card);color:var(--cz-ink);">{{ r.cause }}</span>
</div>
<div style="flex:none;align-self:center;display:flex;align-items:center;padding:0 2px"><dc-import name="Icon" icon="arrowRight" size="26" color="var(--cz-lamp)" hint-size="26px,26px"></dc-import></div>
<div style="flex:1 1 260px;min-width:0;background:var(--cz-paper);border:2px solid var(--cz-made-ink);border-radius:var(--cz-radius-item);padding:16px;display:flex;flex-direction:column;gap:10px">
<span style="font:var(--cz-mono-tag);color:var(--cz-ink-soft)">{{ r.how }}</span>
<span style="display:flex;gap:10px;align-items:flex-start"><span style="flex:none;padding-top:2px"><dc-import name="Icon" icon="{{ r.icon }}" size="20" color="var(--cz-made-ink)" hint-size="20px,20px"></dc-import></span><span style="font:var(--cz-display-card);color:var(--cz-ink);">{{ r.solution }}</span></span>
</div>
</div>
</sc-for>

<div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--cz-desk);border-left:4px solid var(--cz-goal-ink);border-radius:4px 12px 12px 4px;padding:14px 18px">
<span style="font:500 16px/1.3 var(--cz-mono);color:var(--cz-goal-ink)">Target within two quarters</span>
<span style="font:700 22px/1.1 var(--cz-display);color:var(--cz-ink)">4.0/5</span>
<span style="font:400 16px/1.4 var(--cz-sans);color:var(--cz-ink-body)">overall, and 3.8/5 for how Cozy handles complaints</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:560}}">
// The three root causes and their solutions, in the order and with the names of the project page.
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { cells: 'Environment + knowledge', cause: 'No follow-up process or call practice for complaints', how: 'Log changes, and the course Hear Them Out', solution: 'A follow-up process and call practice for complaints', icon: 'cases' },
        { cells: 'Information', cause: 'Space rules members could not see', how: 'Signs in the space, and Cozy in 60 seconds', solution: 'Space rules members can see', icon: 'focus' },
        { cells: 'Information + tools', cause: 'No set steps for Wi-Fi outages', how: 'The Wi-Fi Down card, and an automatic switch to the backup line', solution: 'Set steps for Wi-Fi outages', icon: 'wifi' }
      ]
    };
  }
}
</script>
</body>
</html>
