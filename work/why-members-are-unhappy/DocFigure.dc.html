<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
</helmet>
<figure style="margin:0;display:flex;flex-direction:column;gap:12px">
<sc-if value="{{ hasImage }}" hint-placeholder-val="{{ true }}">
<img src="{{ src }}" alt="{{ alt }}" style="display:block;width:100%;border:1.5px solid #E3DACB;border-radius:16px;background:#F4EFE4">
</sc-if>
<sc-if value="{{ empty }}">
<div role="img" aria-label="{{ alt }}" style="background:#F4EFE4;border:1.5px dashed #8C8170;border-radius:16px;min-height:{{ minH }};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:32px;text-align:center">
<dc-import name="Icon" icon="thought" size="28" color="#8C8170" hint-size="28px,28px"></dc-import>
<span style="font:500 16px/22px 'IBM Plex Mono',monospace;color:#5E5446">{{ num }} goes here</span>
<span style="max-width:460px;font:400 16px/24px 'IBM Plex Sans',sans-serif;color:#3D352A;">{{ note }}</span>
</div>
</sc-if>
<figcaption style="display:flex;gap:10px;font:500 17px/1.35 'IBM Plex Mono',monospace;color:#5E5446;"><b style="color:#8A5300;font-weight:600;flex:none">{{ num }}</b>{{ caption }}</figcaption>
<sc-if value="{{ hasLink }}">
<a href="{{ href }}" style="align-self:flex-start;display:flex;align-items:center;gap:10px;min-height:44px;padding:10px 18px;border:1.5px solid #1F1A12;border-radius:12px;font:600 16px/24px 'IBM Plex Sans',sans-serif;color:#1F1A12;text-decoration:none" style-hover="background:#F4EFE4">{{ hrefLabel }}<dc-import name="Icon" icon="arrowRight" size="18" color="#1F1A12" hint-size="18px,18px"></dc-import></a>
</sc-if>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:700,&quot;height&quot;:320},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Figure 1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;caption&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;src&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hrefLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Open it&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;minHeight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:220,&quot;min&quot;:120,&quot;max&quot;:600,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const src = p.src || '';
    return {
      num: p.num ?? 'Figure 1',
      caption: p.caption ?? '',
      alt: p.alt ?? p.caption ?? '',
      note: p.note ?? p.caption ?? '',
      src,
      hasImage: !!src,
      empty: !src,
      minH: (p.minHeight ?? 220) + 'px',
      href: p.href || '',
      hasLink: !!p.href,
      hrefLabel: p.hrefLabel ?? 'Open it'
    };
  }
}
</script>
</body>
</html>
