<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
</helmet>
<div ref="{{ rootRef }}" style="width:100%;min-width:0">
<sc-if value="{{ wide }}" hint-placeholder-val="{{ true }}">
<div style="border:1.5px solid #E3DACB;border-radius:16px;background:#FBF7EE;overflow-x:auto;overscroll-behavior-x:contain">
<table style="width:100%;min-width:100%;border-collapse:collapse;text-align:left">
<thead>
<tr style="background:#F4EFE4">
<sc-for list="{{ head }}" as="h" hint-placeholder-count="3">
<th scope="col" style="padding:14px 16px;font:500 16px/22px 'IBM Plex Mono',monospace;color:#1F1A12;vertical-align:bottom;border-bottom:1.5px solid #E3DACB;">{{ h }}</th>
</sc-for>
</tr>
</thead>
<tbody>
<sc-for list="{{ rows }}" as="row" hint-placeholder-count="3">
<tr style="border-bottom:1px solid #E3DACB">
<sc-for list="{{ row.cells }}" as="c" hint-placeholder-count="3">
<td style="padding:14px 16px;font:400 16px/24px 'IBM Plex Sans',sans-serif;color:{{ c.color }};vertical-align:top;">
<sc-for list="{{ c.segs }}" as="s" hint-placeholder-count="1">
<sc-if value="{{ s.isLink }}"><a href="{{ s.href }}" style="color:#1F1A12;text-decoration:underline;text-decoration-color:#F2A93B;text-underline-offset:3px">{{ s.t }}</a></sc-if>
<sc-if value="{{ s.isText }}"><span style="font-weight:{{ s.w }};font-family:{{ s.f }};color:{{ s.c }}">{{ s.t }}</span></sc-if>
</sc-for>
</td>
</sc-for>
</tr>
</sc-for>
</tbody>
</table>
</div>
</sc-if>
<sc-if value="{{ narrow }}">
<div style="display:flex;flex-direction:column;gap:12px">
<sc-for list="{{ rows }}" as="row" hint-placeholder-count="3">
<div style="border:1.5px solid #E3DACB;border-radius:16px;background:#FBF7EE;overflow:hidden">
<div style="background:#F4EFE4;padding:12px 16px;font:600 17px/24px 'Archivo',sans-serif;color:#1F1A12;border-bottom:1.5px solid #E3DACB;">{{ row.lead }}</div>
<dl style="margin:0;padding:4px 16px 14px;display:flex;flex-direction:column">
<sc-for list="{{ row.rest }}" as="c" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:2px;padding:10px 0;border-bottom:1px solid #E3DACB">
<dt style="font:500 16px/22px 'IBM Plex Mono',monospace;color:#5E5446;">{{ c.key }}</dt>
<dd style="margin:0;font:400 16px/24px 'IBM Plex Sans',sans-serif;color:#3D352A;">
<sc-for list="{{ c.segs }}" as="s" hint-placeholder-count="1">
<sc-if value="{{ s.isLink }}"><a href="{{ s.href }}" style="color:#1F1A12;text-decoration:underline;text-decoration-color:#F2A93B;text-underline-offset:3px">{{ s.t }}</a></sc-if>
<sc-if value="{{ s.isText }}"><span style="font-weight:{{ s.w }};font-family:{{ s.f }};color:{{ s.c }}">{{ s.t }}</span></sc-if>
</sc-for>
</dd>
</div>
</sc-for>
</dl>
</div>
</sc-for>
</div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:320},&quot;head&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(string|{t:string,b?:boolean,m?:boolean,href?:string}[])[][]&quot;}}">
class Component extends DCLogic {
  state = { w: 0 };
  rootRef = React.createRef();

  componentDidMount() {
    const el = this.rootRef.current;
    if (!el) return;
    this.ro = new ResizeObserver(e => {
      const w = e[0].contentRect.width;
      if (Math.abs(w - this.state.w) > 2) this.setState({ w });
    });
    this.ro.observe(el);
    this.setState({ w: el.getBoundingClientRect().width });
  }

  componentWillUnmount() { if (this.ro) this.ro.disconnect(); }

  seg(cell, first) {
    const raw = typeof cell === 'string' ? [{ t: cell }] : (cell || []);
    return raw.map(s => ({
      t: s.t,
      isLink: !!s.href,
      isText: !s.href,
      href: s.href || '',
      w: s.b || first ? 600 : 400,
      f: s.m ? "'IBM Plex Mono',monospace" : "'IBM Plex Sans',sans-serif",
      c: s.b && first ? '#1F1A12' : (first ? '#1F1A12' : (s.b ? '#1F1A12' : '#3D352A'))
    }));
  }

  plain(cell) {
    const raw = typeof cell === 'string' ? [{ t: cell }] : (cell || []);
    return raw.map(s => s.t).join('');
  }

  renderVals() {
    const head = this.props.head || [];
    const raw = this.props.rows || [];
    const need = Math.max(320, 120 * head.length);
    const wide = this.state.w === 0 ? true : this.state.w >= need;
    const rows = raw.map(r => ({
      lead: this.plain(r[0]),
      cells: r.map((cell, i) => ({ segs: this.seg(cell, i === 0), color: i === 0 ? '#1F1A12' : '#3D352A' })),
      rest: r.slice(1).map((cell, i) => ({ key: head[i + 1] || '', segs: this.seg(cell, false) }))
    }));
    return { head, rows, wide, narrow: !wide, rootRef: this.rootRef };
  }
}
</script>
</body>
</html>
