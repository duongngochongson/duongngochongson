<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
</helmet>
<div ref="{{ hostRef }}" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px">
<sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
<div style="background:{{ c.tint }};border:1.5px solid {{ c.line }};border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:16px">
<span style="font:500 16px/22px 'IBM Plex Mono',monospace;color:{{ c.ink }};">{{ c.label }}</span>
<div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
<span style="font:700 clamp(32px,4vw,40px)/1 'Archivo',sans-serif;letter-spacing:-0.02em;color:{{ c.ink }}">{{ c.to }}</span>
<span style="font:500 16px/22px 'IBM Plex Mono',monospace;color:#5E5446;white-space:nowrap">{{ c.unit }}</span>
</div>
<div style="display:flex;flex-direction:column;gap:9px">
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
<span style="flex:none;width:48px;font:500 16px/22px 'IBM Plex Mono',monospace;color:#5E5446">Now</span>
<span style="flex:1;min-width:0;height:10px;border-radius:999px;background:#FFFFFF;border:1px solid {{ c.line }};overflow:hidden"><span style="display:block;height:100%;width:{{ c.nowW }};background:#8C8170;border-radius:999px;transition:width .9s cubic-bezier(.2,.8,.2,1)"></span></span>
<span style="flex:none;width:80px;text-align:right;font:500 16px/22px 'IBM Plex Mono',monospace;color:#3D352A">{{ c.now }}</span>
</div>
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
<span style="flex:none;width:48px;font:500 16px/22px 'IBM Plex Mono',monospace;color:{{ c.ink }}">Goal</span>
<span style="flex:1;min-width:0;height:10px;border-radius:999px;background:#FFFFFF;border:1px solid {{ c.line }};overflow:hidden"><span style="display:block;height:100%;width:{{ c.toW }};background:{{ c.ink }};border-radius:999px;transition:width 1.1s cubic-bezier(.2,.8,.2,1) .12s"></span></span>
<span style="flex:none;width:80px;text-align:right;font:500 16px/22px 'IBM Plex Mono',monospace;color:{{ c.ink }}">{{ c.to }}</span>
</div>
</div>
<span style="font:400 16px/23px 'IBM Plex Sans',sans-serif;color:#5E5446;">{{ c.note }}</span>
</div>
</sc-for>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:860,&quot;height&quot;:260},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label:string,now:string,to:string,nowVal:number,toVal:number,max?:number,unit?:string,note?:string,accent?:string}[]&quot;}}">
const TONES = {
  amber:  { ink: '#8A5300', tint: '#FBEFDB', line: '#F0D5A4' },
  blue:   { ink: '#2F5A9E', tint: '#E9EFF8', line: '#C3D2EA' },
  green:  { ink: '#2F7A4B', tint: '#E6F2EA', line: '#BFDFCB' },
  red:    { ink: '#B03A48', tint: '#FBEAEC', line: '#EFC6CB' },
  purple: { ink: '#6A4A8C', tint: '#F1EAF8', line: '#D6C8E7' },
  brown:  { ink: '#6B5B4B', tint: '#F1EBE3', line: '#DCD0C2' }
};
class Component extends DCLogic {
  state = { on: false };
  componentDidMount() {
    this.io = new IntersectionObserver(es => {
      if (es.some(e => e.isIntersecting)) { this.setState({ on: true }); this.io.disconnect(); }
    }, { rootMargin: '0px 0px -15% 0px' });
    requestAnimationFrame(() => { if (this.el && this.io) this.io.observe(this.el); });
  }
  componentWillUnmount() { if (this.io) this.io.disconnect(); }
  renderVals() {
    const on = this.state.on;
    const cards = (this.props.items || []).map(it => {
      const t = TONES[it.accent] || TONES.amber;
      const max = it.max ?? 5;
      const pct = v => Math.max(0, Math.min(100, (v / max) * 100)) + '%';
      return {
        label: it.label, now: it.now, to: it.to, unit: it.unit ?? '', note: it.note ?? '',
        nowW: on ? pct(it.nowVal) : '0%',
        toW: on ? pct(it.toVal) : '0%',
        ink: t.ink, tint: t.tint, line: t.line
      };
    });
    return { cards, hostRef: el => { this.el = el; } };
  }
}

</script>
</body>
</html>
