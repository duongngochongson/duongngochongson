<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:140},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;wordmark&quot;,&quot;symbol&quot;,&quot;lockup&quot;],&quot;default&quot;:&quot;lockup&quot;,&quot;tsType&quot;:&quot;'wordmark'|'symbol'|'lockup'&quot;},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;,&quot;ink&quot;,&quot;paper&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'|'ink'|'paper'&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:48,&quot;min&quot;:12,&quot;max&quot;:400,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;}}">
const TONES = {
  light: { letter:'#1F1A12', disc:'#F2A93B', square:'#1F1A12', sqDisc:'#F2A93B' },
  dark:  { letter:'#FFFCF5', disc:'#F2A93B', square:'#3A3125', sqDisc:'#F2A93B' },
  ink:   { letter:'#1F1A12', disc:'#1F1A12', square:'#1F1A12', sqDisc:'transparent' },
  paper: { letter:'#FFFCF5', disc:'#FFFCF5', square:'#FFFCF5', sqDisc:'transparent' },
  // portfolio: the light symbol on the dark ground, so it doesn't sink into the night header (lamp stays amber)
  lit:   { letter:'#FFFCF5', disc:'#F2A93B', square:'#FFFCF5', sqDisc:'#F2A93B' }
};
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'wordmark';
    const s = Number(this.props.size ?? 48);
    const t = { ...(TONES[this.props.tone] || TONES.light) };
    if (this.props.letterColor) t.letter = this.props.letterColor;
    if (this.props.discColor) { t.disc = this.props.discColor; t.sqDisc = this.props.discColor; }
    const r = 216 / 73, lk = s * 0.8, px = n => n.toFixed(2) + 'px';
    return {
      ...t,
      isWordmark: v === 'wordmark', isSymbol: v === 'symbol', isLockup: v === 'lockup',
      wmH: px(s), wmW: px(s * r), symH: px(s),
      lkH: px(lk), lkW: px(lk * r), lkTop: px(s * 0.196), gap: px(s * 0.3)
    };
  }
}
</script>
</body>
