<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="../frame/fonts/fonts.css">
</helmet>
<header style="{{ kindVars }};display:flex;align-items:center;gap:14px;flex-wrap:wrap">
<span style="flex:none;width:44px;height:44px;border-radius:13px;background:var(--cz-kind-tint);border:var(--cz-width-line) solid var(--cz-kind-line);display:flex;align-items:center;justify-content:center">
<dc-import name="Icon" icon="{{ icon }}" size="22" color="var(--cz-kind-ink)" hint-size="22px,22px"></dc-import>
</span>
<h2 style="margin:0;display:flex;gap:12px;align-items:baseline;font:600 clamp(24px,3vw,30px)/1.2 var(--cz-display);letter-spacing:-0.01em;color:var(--cz-ink);">
<sc-if value="{{ hasNum }}" hint-placeholder-val="{{ true }}"><span style="font:500 18px/1 var(--cz-mono);color:var(--cz-kind-ink);flex:none" aria-hidden="true">{{ num }}</span></sc-if>{{ title }}</h2>
<span aria-hidden="true" style="flex:1 1 40px;min-width:20px;height:2px;border-radius:2px;background:var(--cz-kind-line)"></span>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:90},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Section title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;note&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;problem&quot;,&quot;goal&quot;,&quot;made&quot;,&quot;docs&quot;,&quot;summary&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// The color comes from the kind of the section the head sits in (data-kind on the section, see doc-text.css).
// A head can also set its own kind: problem, goal, made, docs or summary.
const KINDS = ['problem', 'goal', 'made', 'docs', 'summary'];
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const num = p.num ?? '';
    const kind = KINDS.includes(p.kind) ? p.kind : '';
    return {
      num, hasNum: !!String(num).length,
      title: p.title ?? '',
      icon: p.icon ?? 'note',
      kindVars: kind ? '--cz-kind-ink:var(--cz-' + kind + '-ink);--cz-kind-tint:var(--cz-' + kind + '-tint);--cz-kind-line:var(--cz-' + kind + '-line)' : ''
    };
  }
}

</script>
</body>
</html>
