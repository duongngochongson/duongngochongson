<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
</helmet>
<header style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
<span style="flex:none;width:44px;height:44px;border-radius:13px;background:{{ tint }};border:1.5px solid {{ line }};display:flex;align-items:center;justify-content:center">
<dc-import name="Icon" icon="{{ icon }}" size="22" color="{{ ink }}" hint-size="22px,22px"></dc-import>
</span>
<h2 style="margin:0;display:flex;gap:12px;align-items:baseline;font:600 clamp(24px,3vw,30px)/1.2 'Archivo',sans-serif;letter-spacing:-0.01em;color:#1F1A12;">
<sc-if value="{{ hasNum }}" hint-placeholder-val="{{ true }}"><span style="font:500 18px/1 'IBM Plex Mono',monospace;color:{{ ink }};flex:none" aria-hidden="true">{{ num }}</span></sc-if>{{ title }}</h2>
<span aria-hidden="true" style="flex:1 1 40px;min-width:20px;height:2px;border-radius:2px;background:{{ line }}"></span>
</header>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:90},&quot;num&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;1&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Section title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;note&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;amber&quot;,&quot;blue&quot;,&quot;green&quot;,&quot;red&quot;,&quot;purple&quot;,&quot;brown&quot;],&quot;default&quot;:&quot;amber&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TONES = {
  amber:  { ink: '#8A5300', tint: '#FBEFDB', line: '#F0D5A4' },
  blue:   { ink: '#2F5A9E', tint: '#E9EFF8', line: '#C3D2EA' },
  green:  { ink: '#2F7A4B', tint: '#E6F2EA', line: '#BFDFCB' },
  red:    { ink: '#B03A48', tint: '#FBEAEC', line: '#EFC6CB' },
  purple: { ink: '#6A4A8C', tint: '#F1EAF8', line: '#D6C8E7' },
  brown:  { ink: '#6B5B4B', tint: '#F1EBE3', line: '#DCD0C2' }
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const t = TONES[p.accent] || TONES.amber;
    const num = p.num ?? '';
    return {
      num, hasNum: !!String(num).length,
      title: p.title ?? '',
      icon: p.icon ?? 'note',
      ink: t.ink, tint: t.tint, line: t.line
    };
  }
}

</script>
</body>
</html>
