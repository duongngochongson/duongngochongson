<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
</helmet>
<aside style="display:flex;gap:14px;align-items:flex-start;background:{{ bg }};border:{{ border }};border-left:{{ borderLeft }};border-radius:{{ radius }};padding:var(--cz-pad-callout)">
<sc-if value="{{ hasIcon }}"><span style="flex:none;padding-top:2px"><dc-import name="Icon" icon="{{ icon }}" size="20" color="{{ ink }}" hint-size="20px,20px"></dc-import></span></sc-if>
<div style="display:flex;flex-direction:column;gap:6px;min-width:0">
<sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span style="font:var(--cz-mono-label);color:{{ ink }}">{{ label }}</span></sc-if>
<p style="margin:0;font:400 17px/26px var(--cz-sans);color:var(--cz-ink-body);"><sc-if value="{{ hasLead }}" hint-placeholder-val="{{ true }}"><b style="font-weight:600;color:var(--cz-ink)">{{ lead }} </b></sc-if>{{ text }}</p>
</div>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:150},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;amber&quot;,&quot;blue&quot;,&quot;green&quot;,&quot;red&quot;,&quot;purple&quot;,&quot;brown&quot;,&quot;mine&quot;],&quot;default&quot;:&quot;amber&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Note&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;info&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
// Tones are colors from doc-text.css. The tone "mine" is for my own notes (how I sorted the causes, my lessons):
// a dashed blue outline, no fill, and no icon unless one is given.
const TONES = ['amber', 'blue', 'green', 'red', 'purple', 'brown'];
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const mine = p.tone === 'mine';
    const tone = TONES.includes(p.tone) ? p.tone : mine ? 'blue' : 'amber';
    const ink = 'var(--cz-' + tone + '-ink)';
    const icon = p.icon ?? (mine ? '' : 'info');
    return {
      label: p.label ?? '', hasLabel: !!(p.label || '').length,
      lead: p.lead ?? '', hasLead: !!(p.lead || '').length,
      text: p.text ?? '',
      icon, hasIcon: !!icon,
      ink,
      bg: mine ? 'none' : 'var(--cz-' + tone + '-tint)',
      border: mine ? 'var(--cz-border-note)' : 'var(--cz-width-line) solid var(--cz-' + tone + '-line)',
      borderLeft: mine ? 'var(--cz-border-note)' : '4px solid ' + ink,
      radius: mine ? 'var(--cz-radius-box)' : '5px 14px 14px 5px'
    };
  }
}

</script>
</body>
</html>
