<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
</helmet>
<aside style="display:flex;gap:14px;align-items:flex-start;background:{{ tint }};border:1.5px solid {{ line }};border-left:4px solid {{ ink }};border-radius:5px 14px 14px 5px;padding:16px 18px">
<span style="flex:none;padding-top:2px"><dc-import name="Icon" icon="{{ icon }}" size="20" color="{{ ink }}" hint-size="20px,20px"></dc-import></span>
<div style="display:flex;flex-direction:column;gap:6px;min-width:0">
<sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}"><span style="font:500 16px/22px 'IBM Plex Mono',monospace;color:{{ ink }}">{{ label }}</span></sc-if>
<p style="margin:0;font:400 17px/26px 'IBM Plex Sans',sans-serif;color:#3D352A;"><sc-if value="{{ hasLead }}" hint-placeholder-val="{{ true }}"><b style="font-weight:600;color:#1F1A12">{{ lead }} </b></sc-if>{{ text }}</p>
</div>
</aside>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:150},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;amber&quot;,&quot;blue&quot;,&quot;green&quot;,&quot;red&quot;,&quot;purple&quot;,&quot;brown&quot;],&quot;default&quot;:&quot;amber&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Note&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;lead&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;info&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TONES = {
  amber:  { ink: '#8A5300', tint: '#FBEFDB', line: '#F0D5A4' },
  blue:   { ink: '#2F5A9E', tint: '#E9EFF8', line: '#C3D2EA' },
  green:  { ink: '#2F7A4B', tint: '#E6F2EA', line: '#BFDFCB' },
  red:    { ink: '#B03A48', tint: '#FBEAEC', line: '#EFC6CB' },
  purple: { ink: '#6A4A8C', tint: '#F1EAF8', line: '#D6C8E7' },
  brown:  { ink: '#6B5B4B', tint: '#F1EBE3', line: '#DCD0C2' }
};
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const t = TONES[p.tone] || TONES.amber;
    return {
      label: p.label ?? '', hasLabel: !!(p.label || '').length,
      lead: p.lead ?? '', hasLead: !!(p.lead || '').length,
      text: p.text ?? '',
      icon: p.icon ?? 'info',
      ink: t.ink, tint: t.tint, line: t.line
    };
  }
}

</script>
</body>
</html>
