<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
</helmet>
<div style="background:#1F1A12;border-radius:16px;padding:clamp(18px,2.5vw,26px);display:flex;flex-direction:column;gap:14px">

<div style="display:flex;align-items:center;gap:14px">
<span style="width:40px;height:40px;border-radius:999px;background:#F2A93B;flex:none;box-shadow:0 0 0 10px rgba(242,169,59,.3)"></span>
<span style="font:500 16px/1.3 'IBM Plex Mono',monospace;color:#F2A93B">Turn on the lamp</span>
</div>

<ol style="margin:0;padding:0 0 0 20px;list-style:none;display:flex;flex-direction:column;gap:10px;border-left:2px solid #4A4235">
<sc-for list="{{ steps }}" as="s" hint-placeholder-count="7">
<li style="position:relative;display:flex;gap:14px;align-items:flex-start;background:#2A2318;border-radius:12px;padding:14px 16px">
<span style="position:absolute;left:-27px;top:18px;width:12px;height:12px;border-radius:999px;background:#F2A93B;border:2px solid #1F1A12"></span>
<span style="flex:none;padding-top:2px"><dc-import name="Icon" icon="{{ s.icon }}" size="22" color="#F2A93B" hint-size="22px,22px"></dc-import></span>
<div style="display:flex;flex-direction:column;gap:5px;min-width:0">
<div style="display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px">
<span style="font:600 18px/1.25 'Archivo',sans-serif;color:#FBF7EE">{{ s.title }}</span>
<span style="font:500 16px/1.2 'IBM Plex Mono',monospace;color:#CFC4B1">{{ s.phase }}</span>
</div>
<span style="font:400 16px/1.45 'IBM Plex Sans',sans-serif;color:#E8DFD0;">{{ s.detail }}</span>
<sc-if value="{{ s.hasEnding }}">
<span style="align-self:flex-start;margin-top:3px;display:flex;align-items:center;gap:8px;padding:5px 11px;border:1.5px solid #F2A93B;border-radius:999px;font:500 16px/1.2 'IBM Plex Mono',monospace;color:#F2A93B">{{ s.ending }}</span>
</sc-if>
</div>
</li>
</sc-for>
</ol>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:720,&quot;height&quot;:720}}">
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { icon: 'info', phase: 'Opening', title: 'The opening', detail: 'The lamp rises into the Cozy symbol, Son introduces himself, five cards, the Welcome, and a short chat to sign in.', hasEnding: false, ending: '' },
        { icon: 'phone', phase: 'Part 1', title: 'Incoming call', detail: 'The phone turns over, Sofia\u2019s member card comes in, and the learner starts the note before answering.', hasEnding: false, ending: '' },
        { icon: 'mobile', phase: 'Part 1', title: 'The call', detail: 'Hear, Empathize, Apologize and Resolve, then the goodbye, End, and Diagnose in a Cozy Desk box.', hasEnding: false, ending: '' },
        { icon: 'star', phase: 'Part 1', title: 'Right after the call', detail: 'The best path goes on to How you handled the call. Any other path meets the member survey a week later, then a debrief and a rewind.', hasEnding: true, ending: 'First ending' },
        { icon: 'monitor', phase: 'Part 2', title: 'Part 2', detail: 'The desk computer starts, the learner signs in, tours Cozy Desk, logs the case from the note, and follows the fast forward to the call back.', hasEnding: false, ending: '' },
        { icon: 'right', phase: 'Part 2', title: 'After Part 2', detail: 'The member survey a week later: 5/5.', hasEnding: true, ending: 'Second ending' },
        { icon: 'cases', phase: 'After the course', title: 'Results and Practice', detail: 'The first-try count, the steps to practice, two questions, the job aids to print, three practices, and a restart.', hasEnding: false, ending: '' }
      ]
    };
  }
}
</script>
</body>
</html>
