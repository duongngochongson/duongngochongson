<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
</helmet>
<sc-if value="{{ isFocusSign }}" hint-placeholder-val="{{ true }}">
<div style="background:#FBF7EE;border:2px solid #2F5A9E;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;width:100%">
<div style="background:#2F5A9E;padding:12px 20px;display:flex;align-items:center;gap:10px">
<dc-import name="Icon" icon="focus" size="22" color="#FBF7EE" hint-size="22px,22px"></dc-import>
<span style="font:500 16px/1.2 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#FBF7EE">FOCUS</span>
</div>
<div style="padding:26px 20px 24px;display:flex;flex-direction:column;gap:16px;align-items:flex-start;flex:1">
<span style="font:700 clamp(28px,6vw,40px)/1.05 'Archivo',sans-serif;letter-spacing:-0.02em;color:#1F1A12">Silent zone.</span>
<span style="display:flex;align-items:center;gap:10px;font:600 clamp(18px,3.2vw,22px)/1.25 'Archivo',sans-serif;color:#1F1A12;">Calls and meetings in Flex<span style="color:#A3501A;font:700 clamp(22px,4vw,28px)/1 'Archivo',sans-serif">→</span></span>
<span style="margin-top:auto;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1.5px solid #A3501A;border-radius:6px;font:500 16px/1.2 'IBM Plex Mono',monospace;color:#A3501A"><dc-import name="Icon" icon="flex" size="18" color="#A3501A" hint-size="18px,18px"></dc-import>Flex · through that door</span>
</div>
<div style="background:#1F1A12;padding:10px 20px;display:flex;align-items:center;gap:10px">
<dc-import name="Logo" variant="symbol" tone="dark" size="20" hint-size="20px,20px"></dc-import>
<span style="font:500 16px/1.2 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#FBF7EE">COZY</span>
</div>
</div>
</sc-if>

<sc-if value="{{ isTape }}">
<div style="background:{{ zoneColor }};min-height:50px;display:flex;align-items:center;gap:12px;padding:12px 18px;width:100%;border-radius:4px">
<dc-import name="Icon" icon="{{ zone }}" size="22" color="#FBF7EE" hint-size="22px,22px"></dc-import>
<span style="font:500 16px/1.2 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#FBF7EE;text-transform:uppercase">{{ tapeText }}</span>
</div>
</sc-if>

<sc-if value="{{ isDeskCard }}">
<div style="background:#FBF7EE;border:1.5px solid #E3DACB;border-radius:10px;box-shadow:0 18px 40px -18px rgba(31,26,18,.35);overflow:hidden;width:100%">
<div style="padding:16px 18px;display:flex;flex-direction:column;gap:10px">
<span style="display:flex;align-items:center;gap:8px;font:500 16px/1.2 'IBM Plex Mono',monospace;letter-spacing:.06em;color:#2F5A9E"><dc-import name="Icon" icon="focus" size="18" color="#2F5A9E" hint-size="18px,18px"></dc-import>FOCUS</span>
<span style="font:700 20px/1.2 'Archivo',sans-serif;color:#1F1A12">You're in Focus.</span>
<span style="font:400 16px/1.4 'IBM Plex Sans',sans-serif;color:#3D352A">Silent work.</span>
<span style="display:flex;align-items:center;gap:8px;font:600 16px/1.3 'Archivo',sans-serif;color:#1F1A12">Calls and meetings in Flex<span style="color:#A3501A;font:700 19px/1 'Archivo',sans-serif">→</span></span>
</div>
<div style="background:#1F1A12;padding:8px 18px;display:flex;align-items:center;gap:8px">
<dc-import name="Logo" variant="symbol" tone="dark" size="16" hint-size="16px,16px"></dc-import>
<span style="font:500 16px/1.2 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#FBF7EE">COZY</span>
</div>
</div>
</sc-if>

<sc-if value="{{ isFridge }}">
<div style="background:#FBF7EE;border:1.5px solid #6B5B4B;border-radius:8px;overflow:hidden;width:100%">
<div style="background:#F0ECE7;padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1.5px solid #6B5B4B">
<dc-import name="Icon" icon="fridge" size="18" color="#6B5B4B" hint-size="18px,18px"></dc-import>
<span style="font:500 16px/1.2 'IBM Plex Mono',monospace;letter-spacing:.06em;color:#6B5B4B">KITCHEN · FRIDGE LABEL</span>
</div>
<div style="padding:16px 14px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end">
<span style="display:flex;align-items:flex-end;gap:8px;font:500 17px/1.2 'IBM Plex Mono',monospace;color:#1F1A12">Name<span style="display:block;width:120px;border-bottom:1.5px solid #8C8170;height:19px"></span></span>
<span style="display:flex;align-items:flex-end;gap:8px;font:500 17px/1.2 'IBM Plex Mono',monospace;color:#1F1A12">Date<span style="display:block;width:96px;border-bottom:1.5px solid #8C8170;height:19px"></span></span>
</div>
</div>
</sc-if>

<sc-if value="{{ isShelf }}">
<div style="background:#F0ECE7;border:1.5px solid #6B5B4B;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:10px;width:100%">
<dc-import name="Icon" icon="kitchen" size="20" color="#6B5B4B" hint-size="20px,20px"></dc-import>
<span style="font:500 16px/1.2 'IBM Plex Mono',monospace;letter-spacing:.08em;color:#6B5B4B">HELP YOURSELF</span>
<span style="font:400 16px/1.3 'IBM Plex Sans',sans-serif;color:#3D352A">Free for anyone to take</span>
</div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:360},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;focusSign&quot;,&quot;floorTape&quot;,&quot;deskCard&quot;,&quot;fridgeLabel&quot;,&quot;shelfLabel&quot;],&quot;default&quot;:&quot;focusSign&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;zone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;focus&quot;,&quot;flex&quot;,&quot;private&quot;,&quot;kitchen&quot;],&quot;default&quot;:&quot;focus&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tapeText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const ZONES = {
  focus: { color: '#2F5A9E', tape: 'Focus · Silent work' },
  flex: { color: '#A3501A', tape: 'Flex · Desk work, calls, meetings' },
  private: { color: '#6A4A8C', tape: 'Private · Rooms with a door' },
  kitchen: { color: '#6B5B4B', tape: 'Kitchen · Shared' }
};
class Component extends DCLogic {
  renderVals() {
    const kind = this.props.kind || 'focusSign';
    const zone = this.props.zone || 'focus';
    const z = ZONES[zone] || ZONES.focus;
    return {
      zone,
      zoneColor: z.color,
      tapeText: this.props.tapeText || z.tape,
      isFocusSign: kind === 'focusSign',
      isTape: kind === 'floorTape',
      isDeskCard: kind === 'deskCard',
      isFridge: kind === 'fridgeLabel',
      isShelf: kind === 'shelfLabel'
    };
  }
}
</script>
</body>
</html>
