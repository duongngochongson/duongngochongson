<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
</helmet>
<div role="img" aria-label="{{ alt }}" style="display:grid;gap:8px;width:100%;grid-template-columns:1.15fr 1fr;grid-template-areas:'focus flex' 'focus private' 'kitchen meeting' 'desk desk';background:#FBF7EE;border:1.5px solid #E3DACB;border-radius:16px;padding:10px">

<div style="grid-area:focus;background:#E9EDF3;border:1.5px solid #2F5A9E;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:140px">
<span style="display:flex;align-items:center;gap:8px;font:500 16px/1.2 'IBM Plex Mono',monospace;color:#2F5A9E"><dc-import name="Icon" icon="focus" size="18" color="#2F5A9E" hint-size="18px,18px"></dc-import>Focus</span>
<sc-if value="{{ focusTag }}"><span style="align-self:flex-start;padding:5px 10px;border:1.5px solid #2F5A9E;border-radius:6px;font:500 16px/1.2 'IBM Plex Mono',monospace;color:#2F5A9E;background:#FBF7EE">{{ focusTagText }}</span></sc-if>
<sc-if value="{{ showDesk }}"><span style="margin-top:auto;display:flex;align-items:center;gap:8px;font:400 16px/1.3 'IBM Plex Sans',sans-serif;color:#3D352A"><span style="width:16px;height:16px;border-radius:999px;background:#F2A93B;flex:none"></span>{{ deskLabel }}</span></sc-if>
</div>

<div style="grid-area:flex;background:#F6ECE5;border:1.5px solid #A3501A;border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:64px">
<span style="display:flex;align-items:center;gap:8px;font:500 16px/1.2 'IBM Plex Mono',monospace;color:#A3501A"><dc-import name="Icon" icon="flex" size="18" color="#A3501A" hint-size="18px,18px"></dc-import>Flex</span>
<sc-if value="{{ flexTag }}"><span style="align-self:flex-start;padding:5px 10px;border:1.5px solid #A3501A;border-radius:6px;font:500 16px/1.2 'IBM Plex Mono',monospace;color:#A3501A;background:#FBF7EE">{{ flexTagText }}</span></sc-if>
</div>

<div style="grid-area:private;background:#EFEAF3;border:1.5px solid #6A4A8C;border-radius:10px;padding:14px;display:flex;align-items:center;gap:8px;min-height:56px">
<dc-import name="Icon" icon="private" size="18" color="#6A4A8C" hint-size="18px,18px"></dc-import>
<span style="font:500 16px/1.2 'IBM Plex Mono',monospace;color:#6A4A8C">Private</span>
</div>

<div style="grid-area:kitchen;background:#F0ECE7;border:1.5px solid #6B5B4B;border-radius:10px;padding:14px;display:flex;align-items:center;gap:8px;min-height:56px">
<dc-import name="Icon" icon="kitchen" size="18" color="#6B5B4B" hint-size="18px,18px"></dc-import>
<span style="font:500 16px/1.2 'IBM Plex Mono',monospace;color:#6B5B4B">Kitchen</span>
</div>

<div style="grid-area:meeting;background:#F4EFE4;border:1.5px solid #8C8170;border-radius:10px;padding:14px;display:flex;align-items:center;gap:8px;min-height:56px">
<dc-import name="Icon" icon="meeting" size="18" color="#5E5446" hint-size="18px,18px"></dc-import>
<span style="font:500 16px/1.2 'IBM Plex Mono',monospace;color:#5E5446">Meeting rooms</span>
</div>

<div style="grid-area:desk;background:#F4EFE4;border:1.5px solid #1F1A12;border-radius:10px;padding:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;min-height:56px">
<span style="display:flex;align-items:center;gap:8px;font:500 16px/1.2 'IBM Plex Mono',monospace;color:#1F1A12"><dc-import name="Icon" icon="desk" size="18" color="#1F1A12" hint-size="18px,18px"></dc-import>Front desk</span>
<sc-if value="{{ showHere }}"><span style="display:flex;align-items:center;gap:8px;font:500 16px/1.2 'IBM Plex Mono',monospace;color:#1F1A12"><span style="width:16px;height:16px;border-radius:999px;background:#F2A93B;flex:none"></span>{{ hereLabel }}</span></sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:340},&quot;hereLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;You are here&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;showHere&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;deskLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;focusTag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;flexTag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return {
      alt: p.alt ?? 'Floor plan of a Cozy space: Focus on the left, Flex and Private on the right, the kitchen and the meeting rooms below them, and the front desk across the bottom.',
      hereLabel: p.hereLabel ?? 'You are here',
      showHere: p.showHere !== false,
      deskLabel: p.deskLabel ?? "Sofia's desk",
      showDesk: !!p.deskLabel,
      focusTagText: p.focusTag || '',
      focusTag: !!p.focusTag,
      flexTagText: p.flexTag || '',
      flexTag: !!p.flexTag
    };
  }
}
</script>
</body>
</html>
