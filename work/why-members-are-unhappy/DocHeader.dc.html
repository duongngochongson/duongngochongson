<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="fonts/fonts.css">
</helmet>
<header style="background:#1F1A12;color:#FBF7EE;border-radius:16px 16px 0 0;padding:clamp(28px,4vw,52px) clamp(20px,4vw,56px) clamp(26px,3.5vw,40px);display:flex;flex-direction:column;gap:clamp(22px,3vw,32px)">
<div style="display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:20px">
<dc-import name="Logo" variant="lockup" tone="lit" size="34" hint-size="124px,34px"></dc-import>
</div>
<div style="display:flex;flex-direction:column;gap:18px">
<span style="font:500 16px/22px 'IBM Plex Mono',monospace;color:#F2A93B;letter-spacing:.02em">Project · {{ project }}</span>
<h1 style="margin:0;font:700 clamp(36px,6vw,60px)/1.03 'Archivo',sans-serif;letter-spacing:-0.03em;color:#FBF7EE">{{ type }}</h1>
<p style="margin:0;font:400 clamp(17px,2vw,20px)/1.5 'IBM Plex Sans',sans-serif;color:#E8DFD0">{{ subtitle }}</p>
</div>
<div style="display:flex;flex-wrap:wrap;gap:0 24px;padding-top:18px;border-top:1px solid #4A4235;font:500 16px/22px 'IBM Plex Mono',monospace;color:#CFC4B1">
<sc-if value="{{ measured }}"><span style="white-space:nowrap">{{ readLabel }}</span></sc-if>
<sc-if value="{{ measured }}"><span style="white-space:nowrap">{{ partsLabel }}</span></sc-if>
</div>
</header>
<div style="height:4px;background:#F2A93B"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:420},&quot;project&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Why Members Are Unhappy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;type&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Case study&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Why Members Are Unhappy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;date&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;October 2026&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;author&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Son Duong&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { mins: 0, secs: 0, figs: 0 };

  componentDidMount() {
    this.t = setTimeout(() => {
      const main = document.querySelector('main') || document.querySelector('article');
      if (!main) return;
      const words = (main.innerText || '').trim().split(/\s+/).filter(Boolean).length;
      this.setState({
        mins: Math.max(1, Math.round(words / 220)),
        secs: document.querySelectorAll('[data-doc-section]').length,
        figs: document.querySelectorAll('figcaption').length
      });
    }, 900);
  }

  componentWillUnmount() { clearTimeout(this.t); }

  renderVals() {
    const p = this.props;
    const s = this.state;
    const parts = [];
    if (s.secs) parts.push(s.secs + (s.secs === 1 ? ' section' : ' sections'));
    if (s.figs) parts.push(s.figs + (s.figs === 1 ? ' figure' : ' figures'));
    return {
      measured: s.mins > 0,
      readLabel: s.mins + ' min read',
      partsLabel: parts.join(' · '),
      project: p.project ?? 'Why Members Are Unhappy',
      type: p.docType ?? p.type ?? 'Case study',
      title: p.docTitle ?? p.title ?? 'Why Members Are Unhappy',
      subtitle: p.subtitle ?? '',
      date: p.date ?? 'October 2026',
      author: p.author ?? 'Son Duong'
    };
  }
}
</script>
</body>
</html>
