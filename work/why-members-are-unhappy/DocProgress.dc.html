<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div aria-hidden="true" style="position:fixed;top:0;left:0;right:0;height:4px;background:rgba(251,247,238,.16);z-index:60;pointer-events:none">
<span style="display:block;height:100%;width:{{ pct }};background:#F2A93B;transition:width .12s linear"></span>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:40}}">
class Component extends DCLogic {
  state = { pct: 0 };
  componentDidMount() {
    this.onScroll = () => {
      const d = document.documentElement;
      const max = d.scrollHeight - d.clientHeight;
      const p = max > 0 ? (d.scrollTop / max) * 100 : 0;
      if (Math.abs(p - this.state.pct) > 0.4) this.setState({ pct: p });
    };
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll);
    this.onScroll();
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onScroll);
  }
  renderVals() { return { pct: this.state.pct.toFixed(1) + '%' }; }
}

</script>
</body>
</html>
